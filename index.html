<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="WrapForge - an open-source studio for designing, previewing, and preparing vehicle wraps."
    />
    <title>WrapForge</title>
    <script>
      try {
        const stored = localStorage.getItem('wrapforge.theme');
        if (stored === 'light' || stored === 'dark') {
          document.documentElement.dataset.theme = stored;
        }
      } catch {
        /* localStorage can be unavailable; the default theme still applies. */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
